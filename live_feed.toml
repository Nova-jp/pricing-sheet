# リアルタイムのフィード(python -m engine.common.live_feed)の設定。
# 変更したらフィードを再起動する(Ctrl+Cで止めて起動し直す)。ブック側(xlwingsのUDFサーバ)の再起動は要らない。
# フィードはLSEG Workspaceのデスクトップセッションでここに並べたRICを購読し続け、data/live.db に書く。
# ブックはShift+F9のたびに LiveQuotes("swap") / LiveQuotes("swap_lch") / LiveQuotes("vol") でそれを読むだけ(docs/architecture.md)。

[timing]
# 値が変わったとき data/live.db に書く間隔(秒)。読む値の遅れは最大でほぼこれだけ
write_interval_sec = 1
# ハートビート(フィードが動いていること)を書く間隔(秒)。ティックが無くても書く
heartbeat_sec = 2
# ハートビートがこれより古い、またはLSEGとの接続が切れていたら「停止」とみなし、LiveQuotesをエラーにする(秒)。
# heartbeat_secの2倍以上にする。止まっている間に計算したいときは、そのシートのB1をFixedにする
stale_after_sec = 10
# 接続が切れたまま戻らないとき、セッションと購読を開き直すまでの時間(秒)。ライブラリ自身の再接続を先に待つ
resubscribe_after_sec = 30

# ── データセット(LiveQuotes の第1引数) ─────────────────────────────────────
# kind = "ois": 行 = [Ticker, BIDとASKのミッド, 起算日(GV1_DATE), 満期日(GV2_DATE)]。
#   起算日・満期日はある銘柄(RD・M1〜)だけ。読む側はTickerで引き当てる(MainシートA列と同じ表記)
# kind = "vol": 行 = [銘柄("1Mx2Y"), RIC, 値(営業日ベースのノーマルvol bp/年 = bp/日×√252)]。満期×原資産の全組み合わせ。
#   購読するのはTraditionのATMストラドルのプレミアム(JPY{満期}{原資産}TOATM=TRDT の PRIMACT_1)で、
#   curve のデータセットのライブのレートで組んだカーブ(historical_curve.toml と同じテナー)でvolに換えて書く。
#   読む側は銘柄・RICで引き当てる(VolPCA・VolHV・BondOption)
# BID・ASKのどちらかが無い、または銘柄の状態が異常(Suspect等)のときは、値を空欄にする(黙って古い値を使わない)

[[datasets]]
name = "swap"
kind = "ois"
