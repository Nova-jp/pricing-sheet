# 雛形(templates/)にLSEGのデータ・ローカルのパスが入っていないか、作業用のブックがコミットされて
# いないかを検査する(pre-commitフックが無いクローンからpushされた場合の最後の防波堤)
name: templates

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_template
      - run: python -m tools.template --check
