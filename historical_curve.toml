# ヒストリカル日次カーブDB(python -m swap_pricing.curve_batch)の設定。
# 変更して再実行すると、入力が変わった日のカーブだけが作り直される。

# カーブの引き方(swap_pricing/curve.py の CURVE_BUILDERS のキー)
builder = "convex_monotone"

# カーブに使うテナー。名前は historical_data.xlsx の Midシートの見出し(4行目)と同じ表記。
# "O/N" はその日のTONA実績(Fixingシート)を使う。
# 使わないテナーは行を消すかコメントアウトする。その日にデータが無いテナーは
# 自動的に外し、あるテナーだけでカーブを引く(DBに使用/不使用テナーを記録)。
tenors = [
    "O/N",
    "1W",
    "1M", "2M", "3M", "4M", "5M", "6M", "7M", "8M", "9M", "10M", "11M", "12M",
    "15M", "18M", "21M", "24M", "36M",
    "4Y", "5Y", "6Y", "7Y", "8Y", "9Y", "10Y", "11Y", "12Y",
    "15Y", "20Y", "25Y", "30Y", "35Y", "40Y",
]
