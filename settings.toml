# 全体の設定(めったに変えない値)。読み込みは engine/common/settings.py。
# 環境ごとの値・秘密(パス・接続先等)は書かない(OPERATIONS.md へ)。

[history]
# 朝バッチ(python -m engine.common.morning_batch)がLSEGからヒストリカルを取り始める日(全データ共通)。
# 早めると、次の朝バッチが足りない過去分だけを取る。遅らせても、取得済みの古い分は消さない。
start = 2022-01-12

# データごとに変えるときだけ書く(書かなければ start)。
# jgb = 2022-01-12       # JGBの引け値(現物オプションのHV・国債先物のベーシス)
# futures = 2022-01-12   # 長期国債先物の清算値
# swaption = 2022-01-12  # スワップションのプレミアム(Traditionの系列は2022-01-12からしか無い)
