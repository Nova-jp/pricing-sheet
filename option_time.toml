# オプションの満期までの残り時間の数え方(engine/common/option/term.py)。スワップション・現物オプションで共通。
# ライブ(今日の、時刻のある計算: フィードのvol・BondOptionの今日のT・PositionSheetの今日の掛け目)だけがこれを使う。
# 過去の日付(朝バッチのvol_quotes・過去の評価日)は、その日の15時(引け)時点 = 満期までの営業日数そのもの。
# 変えたらUDFサーバとフィードを再起動する。

# 満期日のこの時刻に残り0になる(1営業日 = 前の営業日のこの時刻 → 当日のこの時刻)
expiry_time = "15:00"

# "session": 下の時間帯ごとに重みをつけ、時間帯の中では時間に比例して減らす。時間帯の外では減らさない
# "daily"  : 時刻を見ず、当日を丸1日と数える(引け時点の値のまま)
method = "session"

# 1営業日の中で残り時間が減る時間帯。重みは割合(全部で1営業日)。
# start が expiry_time 以降の時間帯は前の営業日に始まる(end が start 以前なら翌日にまたがる)。それ以外は当日。
# 前の営業日が金曜なら、イブニングは金曜の夜〜土曜の朝(休日はその後の朝まで減らさない)。
[[session]]
name = "evening"
start = "15:30"
end = "06:00"
weight = 1

[[session]]
name = "day"
start = "08:45"
end = "15:00"
weight = 2
